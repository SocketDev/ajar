# ajar CI — build/test/lint the shared Rust core on all three target OSes, so
# the Linux (logind) and Windows (powercfg) wake backends are verified on real
# runners (they're cfg-gated and can't be checked from a macOS dev box).
name: "ci: gates"

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: 🧪 ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4 (2025-11-13)
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (2026-07-16)
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2 (2026-03-12)
        with:
          key: ${{ matrix.os }}
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy (all targets, deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test (workspace)
        run: cargo test --workspace

  macos-app:
    name: 🖥️ menu-bar app (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4 (2025-11-13)
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (2026-07-16)
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2 (2026-03-12)
        with:
          key: macos-app
      - name: install xcodegen
        run: brew install xcodegen
      # `make build` regenerates the .xcodeproj from project.yml, compiles the
      # SwiftUI shell, and runs the postBuildScript that builds + bundles the
      # `ajar` binary — so this verifies the whole native shell compiles.
      - name: build menu-bar app
        run: make -C macos/AjarMenuBar build
